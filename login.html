 #toast { position: fixed;
     top: 20px;

<body>
    <header>
            <img src="logo-transparent.png" alt="Logo">
            <h1>CASHGUARD</h1>
    </header>
    <div id="toast"></div>
     <div>
        <form action="login.php" method="POST" class="container mt-4 p-4 bg-light rounded shadow" style="max-width: 400px;">
            <h1 class="text-center mb-4">Welcome back</h1>
            <p class="dd text-center mt-3 text-muted">Please sign in to your account to continue.</p>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control border border-success border-1" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control border border-success border-1" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <input type="checkbox" id="remember" class="form-check-input" name="remember">
                <label for="remember" class="form-check-label">Remember me</label>
                <a href="forgot-password.html" class="pass btn btn-link text-success p-0">Forgot Password?</a>
            </div>
            <button id="btn" onclick="login()" type="button" class="btn btn-success border-radius-5 w-100">Log in</button>
            <p class="text-center mt-3 mb-0">Don't have an account? <a href="signup.html" class="signup btn btn-link text-success text-decoration-none p-0">Sign up</a></p>
        </form>
        <p class="fot mt-3 text-muted text-center">&#169 2026 CASHGUARD.TERMS.PRIVACY.HELP</p>
        <script>
            function showToast(msg) {
  const t = document.getElementById('toast')
  t.innerText = msg
  t.style.display = 'block'
  setTimeout(() => t.style.display = 'none', 2500)
}

function login() {
  const name = document.getElementById('username').value.trim()
  const pass = document.getElementById('password').value.trim()
const btn = document.getElementById('btn')
  if (!name || !pass) {
    return showToast('Please Fill All Fields', true)
  }

  let users = JSON.parse(localStorage.getItem('users')) || []
  
  const found = users.find(u => u.name === name && u.pass === pass)

  if (found) {
     btn.innerHTML = 'Loading...'
     btn.disabled = true
        if (document.getElementById('remember').checked) {
            localStorage.setItem('currentUser', name)
            sessionStorage.removeItem('currentUser')
        } else {
            sessionStorage.setItem('currentUser', name)
            localStorage.removeItem('currentUser')
        }
    setTimeout(() => {
      window.location.href = 'project1.htm'
    }, 1500)
  } else {
        showToast('Wrong Username or Password', true)
  }
}
        </script>
</body>
